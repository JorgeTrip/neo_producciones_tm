name: Versionado y Registro de Cambios Automatizado

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  versionar:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar entorno de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar auto-bumping semántico y generación de git-log.txt
        run: node scripts/actualizarVersionYLog.mjs

      - name: Publicar cambios de versión sin generar bucle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json git-log.txt
          if git diff --staged --quiet; then
            echo "No se registraron cambios en versión ni en git-log.txt."
          else
            git commit -m "chore: Se actualiza versión y registro de cambios [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi
